<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Gradient Studio</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="panel">
    <header class="app-header">
      <h1>Gradient Studio</h1>
      <p>WebGL gradient generator — OkLab stops, premultiplied blur</p>
    </header>

    <details open>
      <summary>Layout</summary>
      <div class="body">
        <div class="layout-canvas-wrap">
          <canvas id="layout-canvas"></canvas>
        </div>
      </div>
    </details>

    <details open>
      <summary>Shapes</summary>
      <div class="body">
        <div id="shapes-list" class="shape-list"></div>
        <div class="shape-list-actions">
          <button class="btn" id="add-shape-btn" type="button">+ Add shape</button>
          <button class="btn" id="duplicate-shape-btn" type="button">Duplicate</button>
        </div>
        <div class="hint">Bottom of the list is the front-most layer — drag a grip to reorder.</div>
      </div>
    </details>

    <details open>
      <summary>Selected shape</summary>
      <div class="body" id="shape-body"></div>
    </details>

    <details open>
      <summary>Gradient</summary>
      <div class="body">
        <div class="grad-strip-wrap">
          <div class="grad-strip" id="grad-strip"></div>
          <div class="grad-handles" id="grad-handles"></div>
        </div>
        <div id="grad-angle"></div>
        <div class="stops" id="grad-stops"></div>
        <button class="btn add-stop" id="add-stop-btn" type="button">+ Add stop</button>
      </div>
    </details>

    <details>
      <summary>Background</summary>
      <div class="body" id="bg-body"></div>
    </details>

    <details open>
      <summary>Blur</summary>
      <div class="body" id="blur-body"></div>
    </details>

    <details>
      <summary>Export</summary>
      <div class="body" id="export-body"></div>
    </details>

    <details>
      <summary>Presets</summary>
      <div class="body" id="presets-body"></div>
    </details>
  </aside>

  <main id="stage">
    <canvas id="preview"></canvas>
  </main>
</div>
<div id="toast"></div>

<script src="src/namespace.js"></script>
<script src="src/utils.js"></script>
<script src="src/color.js"></script>
<script src="src/geom.js"></script>
<script src="src/gradient.js"></script>
<script src="src/shaders.js"></script>
<script src="src/renderer.js"></script>
<script src="src/state.js"></script>
<script src="src/storage.js"></script>
<script src="src/layout.js"></script>
<script src="src/ui.js"></script>
<script src="src/preview.js"></script>
<script src="src/share.js"></script>
<script src="src/exporter.js"></script>
<script src="app.js"></script>
</body>
</html>
